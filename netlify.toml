# Next.js on Netlify (@netlify/plugin-nextjs / OpenNext).
# Publish MUST be the Next dist dir (default `.next`), NOT the repo root.
# If Netlify UI has Publish = "." or blank resolving to repo root, this file overrides it.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
